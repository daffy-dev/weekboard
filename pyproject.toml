[project]
name = "weekboard"
version = "0.1.0"
description = "A week-shaped terminal to-do board that redraws your desktop wallpaper."
requires-python = ">=3.10"
dependencies = [
  "watchdog>=4.0.0",
  "click>=8.1",
  "jinja2>=3.1",
  "playwright>=1.44",
  "psutil>=5.9",
  "textual>=0.60",
  "numpy>=1.24",
  "pillow>=10.0",
]

[project.scripts]
wb = "weekboard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["weekboard"]

[tool.setuptools.package-data]
weekboard = ["templates/*.j2", "assets/*", "assets/fonts/*"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
